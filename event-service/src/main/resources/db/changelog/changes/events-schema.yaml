databaseChangeLog:
  - changeSet:
      id: events-create-schema
      author: Codex
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS events
  - changeSet:
      id: events-events
      author: Codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: events
                tableName: events
      changes:
        - createTable:
            schemaName: events
            tableName: events
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: organizer_id, type: uuid, constraints: { nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: description, type: varchar(2000) }
              - column: { name: location, type: varchar(255) }
              - column: { name: latitude, type: double }
              - column: { name: longitude, type: double }
              - column: { name: starts_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: ends_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            schemaName: events
            tableName: events
            indexName: idx_events_organizer
            columns:
              - column: { name: organizer_id }
  - changeSet:
      id: events-invitations
      author: Codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: events
                tableName: invitations
      changes:
        - createTable:
            schemaName: events
            tableName: invitations
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: event_id, type: uuid, constraints: { nullable: false } }
              - column: { name: invitee_user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addUniqueConstraint:
            schemaName: events
            tableName: invitations
            columnNames: event_id, invitee_user_id
            constraintName: uq_invitations_event_invitee
        - addForeignKeyConstraint:
            baseTableSchemaName: events
            baseTableName: invitations
            baseColumnNames: event_id
            constraintName: fk_invitations_event
            referencedTableSchemaName: events
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE
  - changeSet:
      id: events-registrations
      author: Codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: events
                tableName: registrations
      changes:
        - createTable:
            schemaName: events
            tableName: registrations
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: event_id, type: uuid, constraints: { nullable: false } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: role_name, type: varchar(40), constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - addUniqueConstraint:
            schemaName: events
            tableName: registrations
            columnNames: event_id, user_id
            constraintName: uq_registrations_event_user
        - addForeignKeyConstraint:
            baseTableSchemaName: events
            baseTableName: registrations
            baseColumnNames: event_id
            constraintName: fk_registrations_event
            referencedTableSchemaName: events
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: events-notifications
      author: Codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                schemaName: events
                tableName: notifications
      changes:
        - createTable:
            schemaName: events
            tableName: notifications
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: recipient_user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: title, type: varchar(200), constraints: { nullable: false } }
              - column: { name: message, type: varchar(1000), constraints: { nullable: false } }
              - column: { name: event_id, type: uuid }
              - column: { name: read_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
        - createIndex:
            schemaName: events
            tableName: notifications
            indexName: idx_notifications_recipient_created
            columns:
              - column: { name: recipient_user_id }
              - column: { name: created_at }
        - addForeignKeyConstraint:
            baseTableSchemaName: events
            baseTableName: notifications
            baseColumnNames: event_id
            constraintName: fk_notifications_event
            referencedTableSchemaName: events
            referencedTableName: events
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: events-cancelled-at
      author: Codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                schemaName: events
                tableName: events
                columnName: cancelled_at
      changes:
        - addColumn:
            schemaName: events
            tableName: events
            columns:
              - column: { name: cancelled_at, type: timestamptz }
