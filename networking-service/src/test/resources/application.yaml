spring:
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:events_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS networking
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: networking
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: networking
    liquibase-schema: public
eureka:
  client:
    enabled: false
app:
  jwt:
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
