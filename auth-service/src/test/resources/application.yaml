spring:
  cloud:
    vault:
      enabled: false
  datasource:
    url: jdbc:h2:mem:events_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS auth
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: auth
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: auth
    liquibase-schema: public
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    org.springframework.security: WARN

app:
  jwt:
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    expiration-ms: 3600000
  frontend:
    url: http://localhost:5173
  oauth2:
    callback-base-url: http://localhost:8080/api/auth
  github:
    client-id: test-client-id
    client-secret: test-client-secret
  internal:
    token: test-internal-token
