name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test backend services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B test

  sonarqube-tests:
    name: SonarQube services analysis
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'event-manager-services' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_SERVICES: auth-service,user-service,event-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run selected service tests with coverage
        run: >
          mvn -B -pl "${SONAR_SERVICES}"
          org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
          test
          org.jacoco:jacoco-maven-plugin:0.8.13:report

      - name: Analyze selected services with SonarQube
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_ORGANIZATION != '' }}
        run: |
          for service in auth-service user-service event-service; do
            mvn -B -f "${service}/pom.xml" org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.organization="${SONAR_ORGANIZATION}" \
              -Dsonar.projectKey="${SONAR_PROJECT_KEY}:${service}" \
              -Dsonar.projectName="${service}" \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          done

      - name: Require SonarQube secrets
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' || env.SONAR_ORGANIZATION == '' }}
        run: |
          echo "SONAR_TOKEN, SONAR_HOST_URL and SONAR_ORGANIZATION must be configured for SonarQube analysis."
          exit 1

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config

      - name: Build all service images
        run: docker compose build
